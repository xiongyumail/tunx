name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Lint and rulesets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables shellcheck
      - name: Static checks
        run: sudo tests/static.sh

  config:
    name: Config checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Config checks
        run: tests/config.sh
